name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truenorth
          POSTGRES_PASSWORD: truenorth
          POSTGRES_DB: truenorth_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://truenorth:truenorth@localhost:5432/truenorth_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy truenorth --ignore-missing-imports

      - name: Tests
        if: always()
        run: poetry run pytest tests -q --junitxml=pytest.xml

      - name: Test summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("pytest.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          n, f, e, k = (int(s.get(x, 0)) for x in ("tests", "failures", "errors", "skipped"))
          print(f"## TrueNorth core tests\n\n**{n - f - e - k} passed**, {f} failed, {e} errors, {k} skipped, {n} total")
          PY

  node:
    name: Node SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Node checks
        run: make test-node

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/sdk-go/go.mod

      - name: Run Go checks
        run: make test-go

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Rust checks
        run: make test-rust
