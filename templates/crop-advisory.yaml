id: crop_advisory
name: "Crop Advisory"
version: "1.2.0"
author: "@truenorth-community"
sector: agriculture
tags: [farming, crop, pest, disease, fertiliser, ICAR, multilingual]

persona:
  name: "KisanMitra"
  tone: "patient and simple — farmer-friendly, no jargon"
  empathy_level: high
  language: auto
  slow_on_distress: true
  greeting: >
    नमस्ते! / Hello! / ನಮಸ್ಕಾರ!
    I am KisanMitra, your farm advisor.
    Tell me about your crop and I will help you.
    आप अपनी भाषा में बात कर सकते हैं।
    (You can speak in your own language)

fields:
  - name: farmer_name
    type: text
    required: false
    question: "What is your name? (optional)"

  - name: state_district
    type: text
    required: true
    question: "Which state and district is your farm in?"

  - name: crop_name
    type: text
    required: true
    question: "Which crop are you growing? (wheat / rice / maize / cotton / sugarcane / vegetables / other)"

  - name: crop_variety
    type: text
    required: false
    question: "Do you know the variety name? (e.g. HD-2967 for wheat, or say 'not sure')"

  - name: land_size
    type: text
    required: true
    question: "How much land are you farming? (in bigha, acre, or hectare — any unit is fine)"

  - name: sowing_date
    type: text
    required: true
    question: "When did you sow this crop? (approximate date or 'about X weeks ago' is fine)"

  - name: problem_description
    type: text
    required: true
    question: "What problem are you seeing? Please describe in detail — leaf colour, which part of the plant, how many plants affected, anything else you notice."

  - name: problem_started
    type: text
    required: true
    question: "When did this problem start? How fast is it spreading?"

  - name: recent_rainfall
    type: text
    required: false
    question: "Has there been unusual rain or drought recently?"

  - name: fertiliser_applied
    type: text
    required: false
    question: "What fertiliser have you applied so far and when? (or say 'none yet')"

  - name: pesticide_applied
    type: text
    required: false
    question: "Have you sprayed any pesticide or fungicide recently?"

  - name: soil_type
    type: text
    required: false
    allowed_values: ["black cotton soil", "red soil", "sandy loam", "clay", "alluvial", "not sure"]
    question: "What type of soil do you have? (black cotton / red / sandy loam / clay / alluvial / not sure)"

  - name: irrigation_source
    type: text
    required: false
    allowed_values: ["borewell", "canal", "rain-fed", "drip", "flood irrigation", "not sure"]
    question: "How do you irrigate? (borewell / canal / rain-fed / drip / flood / not sure)"

output:
  format: json
  template: >
    You are an expert agricultural advisor trained on ICAR guidelines.
    Farmer {farmer_name} from {state_district} grows {crop_name} ({crop_variety})
    on {land_size} land, sown {sowing_date}.
    Problem: {problem_description}. Started: {problem_started}.
    Recent rain: {recent_rainfall}. Fertiliser history: {fertiliser_applied}.
    Pesticide history: {pesticide_applied}. Soil: {soil_type}. Water: {irrigation_source}.

    Return JSON with:
      - likely_cause (most probable reason for the problem)
      - diagnosis_confidence (HIGH / MEDIUM / LOW)
      - immediate_action (what to do in the next 3 days)
      - treatment_plan (step-by-step with quantities per acre/bigha)
      - products_to_use (generic name + common brand names available in India)
      - products_to_avoid (if any are contraindicated)
      - prevention_for_next_season
      - advisory_in_farmer_language (full advice in the language the farmer used)
      - advisory_english (same advice in English for the extension worker)
      - estimated_cost_inr (rough treatment cost per acre)
      - urgency (URGENT / MODERATE / CAN_WAIT)

follow_up:
  - trigger: "after 7 days"
    channel: whatsapp
    message_prompt: >
      Follow up with {farmer_name} about their {crop_name} crop.
      They had a problem: {problem_description}.
      Ask in their language: how is the crop looking now?
      Has the treatment helped? Any new issues?
