#    Lawyers spend 45 minutes extracting what should take 10.
#
#  TrueNorth:
#    Guides the client through what to remember.
#    Asks follow-up questions based on answers (show_if logic).
#    Generates a properly structured case brief for the advocate.
#    Client-facing language is simple. Lawyer-facing output is technical.
#
#  CASE TYPES SUPPORTED (set case_type field):
#    - personal_injury     (accident, medical negligence)
#    - consumer_complaint  (defective product, service failure)
#    - employment_dispute  (wrongful termination, wage theft, harassment)
#    - property_dispute    (land encroachment, landlord conflict)
#    - cyber_crime         (fraud, online harassment)
#    - family_matter       (maintenance, custody — handled sensitively)
