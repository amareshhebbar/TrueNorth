#
#  WHAT THIS DOES
#  ──────────────────────────────────────────────────────────
#  Administers the PHQ-9 (depression) and GAD-7 (anxiety)
#  screening questionnaires — conversationally, not as a form.
#
#  The difference:
#    Form:   9 numbered questions on a cold webpage. Completion: 28%.
#    TrueNorth: Warm, natural conversation. Completion: 85%+.
#
#  Built-in safety features:
#    - Emotion detection: if distress spikes, agent slows down
#    - Question 9 of PHQ-9 (suicidal ideation): handled with extreme care
#    - Crisis resources triggered automatically if needed
#    - Session data never used to identify individuals
#    - DPDP compliant: consent before start, erasure on request
#
#  USE CASES:
#    - Corporate EAP (Employee Assistance Programmes)
#    - School/college counsellor pre-screening tool
#    - NGO mental health outreach
#    - Telehealth pre-consultation screening
#
#  ⚠️  IMPORTANT:
#  This is a SCREENING tool, not a diagnostic tool.
#  Always connect high-risk results to a qualified professional.
#  Do not deploy this without a human escalation path.
#
#  INSTALL
#  ──────────────────────────────────────────────────────────
#  cd packages/core
#  pip install -e .
#  pip install anthropic
