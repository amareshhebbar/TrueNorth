#  WHAT THIS DOES
#  ──────────────────────────────────────────────────────────
#  First-round candidate screening that saves 45 minutes
#  of recruiter time per candidate.
#
#  Candidates receive a WhatsApp or web link after applying.
#  TrueNorth conducts the screening conversationally.
#  Recruiter gets a ranked shortlist — not 200 raw applications.
#
#  Features:
#    - Role-specific technical questions (configure in YAML)
#    - Automatic scorecard generated per candidate
#    - Detects red flags: inflated experience, vague answers
#    - Sends structured brief to ATS via webhook
#    - DPDP compliant: candidate consent before data collection
#
#  INSTALL
#  ──────────────────────────────────────────────────────────
#  cd packages/core
#  pip install -e .
#  pip install anthropic
#
#  CUSTOMISE FOR YOUR ROLE
#  ──────────────────────────────────────────────────────────
#  Change these fields to match your job:
#    - role_applied (the job title)
#    - technical_questions (up to 3 role-specific questions)
#    - min_experience_years (minimum requirement)
#    - required_skills (comma-separated must-haves)
#  Everything else stays the same across all roles.
#
