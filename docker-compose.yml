version: "3.9"

services:
  api:
    build: packages/core
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://truenorth:truenorth@postgres:5432/truenorth
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - packages/core/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/core:/app
    command: uvicorn truenorth.api.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: truenorth
      POSTGRES_PASSWORD: truenorth
      POSTGRES_DB: truenorth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truenorth"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
