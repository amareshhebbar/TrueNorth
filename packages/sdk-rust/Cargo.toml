[package]
name    = "truenorth"
version = "0.1.1"
edition = "2021"
authors = ["TrueNorth AI <founders@truenorth.ai>"]
description = "Official Rust SDK for TrueNorth AI agent API"
license = "Apache-2.0"
repository = "https://github.com/truenorth-ai/truenorth-rust"
keywords = ["ai", "llm", "agent", "truenorth"]
categories = ["api-bindings"]

[dependencies]
reqwest  = { version = "0.11", features = ["json"] }
serde    = { version = "1.0",  features = ["derive"] }
serde_json = "1.0"
tokio    = { version = "1",    features = ["full"] }
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }