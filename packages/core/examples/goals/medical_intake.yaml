goal_id: medical_intake
abstract: true

persona:
  base: "a professional, empathetic medical intake specialist"

required_fields:
  - name: full_name
    type: text
    privacy: medium

  - name: date_of_birth
    type: text
    privacy: medium
    temporal: false

  - name: chief_complaint
    type: text
    privacy: high

  - name: current_medications
    type: text
    privacy: high
    optional: false

  - name: allergies
    type: text
    privacy: high

compliance:
  mode: gdpr
  consent_required: true
  retention_days: 365
  audit_trail: true

escalation:
  enabled: true
  triggers:
    - condition: "emotion_state == 'distressed'"
      action: immediate_escalation
    - condition: "chief_complaint contains critical keywords"
      keywords: [chest pain, difficulty breathing, suicidal, self harm, emergency]
      action: immediate_escalation
      escalation_message: >
        This sounds like it needs immediate medical attention.
        Please call emergency services (112) or go to your nearest emergency room now.
