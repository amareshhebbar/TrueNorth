id: medical_intake
name: "Medical Intake"
version: "2.0"

persona:
  name: "Dr. TrueNorth"
  tone: "clinical"

fields:
  - name: full_name
    type: text
    required: true
    question: "What is your full name?"

  - name: date_of_birth
    type: text
    required: true
    question: "What is your date of birth? (DD/MM/YYYY)"

  - name: chief_complaint
    type: text
    required: true
    question: "What is the main reason for your visit today?"

  - name: pain_scale
    type: integer
    required: true
    min: 0
    max: 10
    question: "On a scale of 0–10, how would you rate your pain or discomfort?"

  - name: symptom_duration
    type: text
    required: true
    question: "How long have you been experiencing these symptoms?"

  - name: current_medications
    type: text
    required: false
    question: "Are you currently taking any medications? If yes, please list them."

  - name: known_allergies
    type: text
    required: false
    question: "Do you have any known drug allergies?"

  - name: medical_history
    type: text
    required: false
    question: "Do you have any significant medical history? (e.g. diabetes, hypertension)"

  - name: emergency_contact
    type: text
    required: true
    question: "What is the name and phone number of your emergency contact?"

output:
  format: json
  template: >
    Medical intake summary for {full_name}. Chief complaint: {chief_complaint}.
    Pain scale: {pain_scale}/10. Duration: {symptom_duration}.
