id: fitness_plan
name: "Fitness Plan"
version: "1.0"

persona:
  name: "Alex"
  tone: "warm"

fields:
  - name: name
    type: text
    required: true
    question: "What's your name?"

  - name: age
    type: integer
    required: true
    min: 16
    max: 100
    question: "How old are you?"

  - name: weight_kg
    type: number
    required: true
    question: "What's your current weight in kg?"

  - name: height_cm
    type: number
    required: true
    question: "What's your height in cm?"

  - name: primary_goal
    type: text
    required: true
    allowed_values: [lose weight, build muscle, run 5k, general fitness, improve flexibility]
    question: "What is your primary fitness goal?"

  - name: activity_level
    type: text
    required: true
    allowed_values: [sedentary, lightly active, moderately active, very active, extremely active]
    question: "How would you describe your current activity level?"

  - name: days_per_week
    type: integer
    required: true
    min: 1
    max: 7
    question: "How many days per week can you train?"

  - name: session_duration_minutes
    type: integer
    required: true
    min: 15
    max: 180
    question: "How long can each training session be (minutes)?"

  - name: has_gym_access
    type: boolean
    required: true
    question: "Do you have access to a gym or equipment?"

  - name: has_injury
    type: boolean
    required: true
    question: "Do you have any current injuries or physical limitations?"

  - name: injury_description
    type: text
    required: false
    if_true: has_injury
    question: "Please describe your injury or limitation."

  - name: target_muscle_groups
    type: text
    required: false
    if_value_is:
      field: primary_goal
      value: build muscle
    question: "Which muscle groups do you want to focus on?"

  - name: current_lifts_kg
    type: text
    required: false
    if_value_is:
      field: primary_goal
      value: build muscle
    question: "What are your current lifts (bench, squat, deadlift) in kg?"

  - name: target_5k_time_minutes
    type: integer
    required: false
    if_value_is:
      field: primary_goal
      value: run 5k
    question: "What is your target 5k time in minutes?"

  - name: recovery_focus
    type: boolean
    required: false
    if_numeric_gt:
      field: age
      value: 45
    question: "Would you like to incorporate recovery and mobility work?"

  - name: beginner_guidance
    type: boolean
    required: false
    if_value_in:
      field: activity_level
      values: [sedentary, lightly active]
    question: "Would you like beginner-friendly guidance?"

output:
  format: json
  template: >
    Create a personalised 4-week fitness plan for {name}, aged {age}.
    Goal: {primary_goal}. Activity level: {activity_level}.
    Available {days_per_week} days/week, {session_duration_minutes} min/session.
    Gym access: {has_gym_access}.
