[tool.poetry]
name = "truenorth"
version = "0.1.0"
description = "Conversation-first AI agent framework"
authors = ["Studio Ilios <hello@studioilios.com>"]
readme = "README.md"
packages = [{include = "truenorth"}, {include = "cli"}]

[tool.poetry.scripts]
truenorth = "cli.main:cli"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
redis = {extras = ["hiredis"], version = "^5.2.0"}
anthropic = "^0.40.0"
openai = "^1.57.0"
google-generativeai = "^0.8.3"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.28.0"
pyyaml = "^6.0.2"
jinja2 = "^3.1.4"
click = "^8.1.7"
rich = "^13.9.0"
cryptography = "^44.0.0"
python-multipart = "^0.0.18"
weasyprint = "^63.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
factory-boy = "^3.3.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
