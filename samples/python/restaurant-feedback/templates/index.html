<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>{{ restaurant }} — Feedback</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       background:#fffbf0;min-height:100vh;display:flex;flex-direction:column;
       align-items:center;justify-content:flex-start;padding:16px;}
  .card{background:white;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,.08);
        width:100%;max-width:420px;display:flex;flex-direction:column;height:85vh;overflow:hidden;}
  .header{padding:16px 20px;border-bottom:1px solid #fde68a;text-align:center;flex-shrink:0;}
  .header h1{font-size:1.1rem;color:#92400e;font-weight:700;}
  .header p{font-size:.8rem;color:#a16207;margin-top:2px;}
  .progress-bar{height:3px;background:#fef3c7;width:100%;}
  .progress-fill{height:100%;background:#f59e0b;border-radius:2px;
                 transition:width .4s ease;width:0%;}
  .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .bubble{padding:10px 14px;border-radius:16px;max-width:85%;font-size:.92rem;
          line-height:1.5;word-wrap:break-word;}
  .agent{background:#fef3c7;color:#92400e;align-self:flex-start;border-bottom-left-radius:4px;}
  .user{background:#f59e0b;color:white;align-self:flex-end;border-bottom-right-radius:4px;}
  .typing{display:flex;gap:4px;align-items:center;padding:10px 14px;
          background:#fef3c7;border-radius:16px;border-bottom-left-radius:4px;
          align-self:flex-start;}
  .dot{width:7px;height:7px;background:#a16207;border-radius:50%;
       animation:bounce .9s infinite;}
  .dot:nth-child(2){animation-delay:.15s;}
  .dot:nth-child(3){animation-delay:.30s;}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
  .input-area{padding:12px 16px;border-top:1px solid #fde68a;display:flex;gap:8px;flex-shrink:0;}
  input{flex:1;border:1.5px solid #fde68a;border-radius:12px;padding:10px 14px;
        font-size:.9rem;outline:none;background:#fffbf0;color:#1e293b;}
  input:focus{border-color:#f59e0b;}
  button{background:#f59e0b;color:white;border:none;border-radius:12px;
         padding:10px 18px;font-size:.9rem;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.4;cursor:default;}
  .thank-you{text-align:center;padding:24px;color:#92400e;}
  .thank-you .emoji{font-size:3rem;margin-bottom:12px;}
  .thank-you h2{font-size:1.2rem;margin-bottom:8px;}
  .thank-you p{font-size:.9rem;color:#a16207;line-height:1.6;}
  .star{color:#f59e0b;font-size:1.5rem;}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>🍽️ {{ restaurant }}</h1>
    <p>Share your experience — takes 2 minutes</p>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div class="messages" id="messages"></div>
  <div class="input-area" id="inputArea">
    <input id="input" type="text" placeholder="Type your reply..."
           autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let sessionId = null;
let complete  = false;

async function init() {
  const res  = await fetch('/api/start', {method:'POST'});
  const data = await res.json();
  sessionId  = data.session_id;
  appendBubble('agent', data.text);
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || complete) return;

  input.value = '';
  appendBubble('user', text);
  showTyping();

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  try {
    const res  = await fetch('/api/message', {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body:    JSON.stringify({session_id: sessionId, text}),
    });
    const data = await res.json();
    hideTyping();

    if (data.completion !== undefined) {
      document.getElementById('progress').style.width = data.completion + '%';
    }

    if (data.is_complete) {
      complete = true;
      appendBubble('agent', data.text);
      setTimeout(() => showThankYou(data.thank_you), 800);
    } else {
      appendBubble('agent', data.text);
      btn.disabled = false;
      document.getElementById('input').focus();
    }
  } catch {
    hideTyping();
    appendBubble('agent', 'Sorry, something went wrong. Please try again.');
    btn.disabled = false;
  }
}

function appendBubble(role, text) {
  const msgs = document.getElementById('messages');
  const div  = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

let typingEl = null;
function showTyping() {
  const msgs = document.getElementById('messages');
  typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(typingEl);
  msgs.scrollTop = msgs.scrollHeight;
}
function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function showThankYou(message) {
  const card = document.querySelector('.card');
  card.innerHTML = `
    <div class="thank-you">
      <div class="emoji">🙏</div>
      <div class="star">★★★★★</div>
      <h2>Thank you!</h2>
      <p>${message || 'Your feedback means everything to us. See you soon!'}</p>
    </div>`;
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

init();
</script>
</body>
</html>
