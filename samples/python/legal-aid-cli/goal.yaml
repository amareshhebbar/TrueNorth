# ============================================================
#  TrueNorth Goal: Legal Aid Intake
#  Used by: legal-aid-cli — terminal app for NGO legal workers
# ============================================================
id: legal_aid_intake
name: "Legal Aid Intake"
version: "1.0.0"
sector: legal
tags: [legal, intake, NGO, rural, India, DPDP]

compliance:
  dpdp: true
  purpose: "Legal aid intake for free legal assistance"
  retention_days: 730

persona:
  name: "Legal Aid Assistant"
  tone: "patient, clear, and non-judgmental — the person may never have spoken to a lawyer"
  empathy_level: high
  slow_on_distress: true
  language: auto
  greeting: >
    Namaste! I am here to help you prepare your legal matter.
    I will ask you a few questions. Take your time — there are no wrong answers.
    Everything you share is confidential.

fields:
  - name: client_name
    type: text
    required: true
    question: "What is your name?"

  - name: client_phone
    type: text
    required: true
    question: "Your phone number? (so the advocate can reach you)"

  - name: state
    type: text
    required: true
    question: "Which state are you from?"

  - name: case_type
    type: text
    required: true
    allowed_values:
      - personal_injury
      - consumer_complaint
      - employment_dispute
      - property_dispute
      - domestic_violence
      - landlord_tenant
      - wage_theft
      - cyber_fraud
      - other
    question: >
      What kind of legal problem do you have?
      (personal injury / consumer complaint / employment dispute /
       property dispute / domestic violence / landlord tenant /
       wage theft / cyber fraud / other)

  - name: incident_description
    type: text
    required: true
    question: "Please describe what happened. Take your time."

  - name: incident_date
    type: text
    required: true
    question: "When did this happen? (approximate date)"

  - name: other_party
    type: text
    required: true
    question: "Who is the other party — person, company, government?"

  - name: injury_or_loss
    type: text
    required: true
    question: "What is the injury or loss — physical, financial, or property?"

  - name: loss_amount_inr
    type: integer
    required: false
    min: 0
    question: "Approximate financial loss in ₹? (say 0 if not financial)"

  - name: documents_available
    type: text
    required: true
    question: "What documents do you have — contracts, bills, photos, messages, medical reports, FIR?"

  - name: previous_action_taken
    type: text
    required: false
    question: "Have you reported this anywhere before — police, consumer forum, company? What happened?"

  - name: desired_outcome
    type: text
    required: true
    question: "What do you want as the outcome — compensation, apology, action against the other party?"

  - name: income_level
    type: text
    required: true
    allowed_values: ["below 1 lakh", "1-3 lakh", "3-5 lakh", "above 5 lakh", "prefer not to say"]
    question: "Annual family income? (below 1 lakh / 1-3 lakh / 3-5 lakh / above 5 lakh / prefer not to say)"

output:
  format: json
  template: >
    You are an experienced Indian paralegal in a free legal aid clinic.
    Client: {client_name}, phone: {client_phone}, state: {state}.
    Case type: {case_type}. Incident: {incident_description}.
    Date: {incident_date}. Other party: {other_party}.
    Loss/injury: {injury_or_loss}. Financial loss: ₹{loss_amount_inr}.
    Documents: {documents_available}. Previous action: {previous_action_taken}.
    Desired outcome: {desired_outcome}. Income: {income_level}.

    Return JSON with:
    - incident_summary (2 clear sentences)
    - case_type_formal (legal classification)
    - applicable_laws (list: relevant Indian laws with section numbers)
    - jurisdiction (which court or forum)
    - limitation_period (legal deadline — exact date if possible)
    - case_strength (STRONG/MODERATE/WEAK with one-sentence reason)
    - eligible_for_free_aid (true/false — true if income below 3 lakh or SC/ST)
    - documents_needed (list of what to collect before the advocate meeting)
    - documents_missing (gaps between what they have vs need)
    - immediate_steps (3 actions to take this week)
    - advocate_brief (formal 250-word case note for the lawyer)
    - client_summary (same in simple plain language for the client)
    - estimated_compensation_range (range based on similar cases, in ₹)