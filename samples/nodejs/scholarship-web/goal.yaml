# ============================================================
#  TrueNorth Goal: Scholarship Eligibility Finder (Web)
# ============================================================
id: scholarship_finder
name: "Scholarship Finder"
version: "1.0.0"
sector: education
tags: [scholarship, students, India, NSP, eligibility]

persona:
  name: "ScholarBot"
  tone: "encouraging and clear — speak like a helpful older sibling"
  empathy_level: high
  language: auto
  greeting: >
    Hi! I am ScholarBot.
    I will find every scholarship you qualify for in under 5 minutes.
    Thousands of students miss scholarships just because they never applied.
    Let us make sure that does not happen to you!

fields:
  - name: student_name
    type: text
    required: true
    question: "What is your name?"

  - name: state
    type: text
    required: true
    question: "Which state are you from?"

  - name: gender
    type: text
    required: true
    allowed_values: [male, female, other]
    question: "Your gender? (male / female / other)"

  - name: category
    type: text
    required: true
    allowed_values: [SC, ST, OBC, General, Minority, EWS]
    question: "Category? (SC / ST / OBC / General / Minority / EWS)"

  - name: class12_percent
    type: number
    required: true
    min: 0
    max: 100
    question: "Class 12 percentage? (or say 'currently in Class 12')"

  - name: annual_income_lpa
    type: number
    required: true
    min: 0
    max: 50
    question: "Family annual income in lakhs? (e.g. 2.5 for ₹2.5 lakh)"

  - name: current_course
    type: text
    required: true
    question: "Current course? (e.g. B.Tech, BSc, BA, MBBS, Diploma, Class 11)"

  - name: college_type
    type: text
    required: true
    allowed_values: [government, private, aided, not yet admitted]
    question: "College type? (government / private / aided / not yet admitted)"

  - name: disability
    type: boolean
    required: true
    question: "Do you have any disability? (yes / no)"

  - name: rural_area
    type: boolean
    required: false
    question: "Do you live in a rural area or village? (yes / no)"

output:
  format: json
  template: >
    Scholarship advisor for Indian students.
    Student: {student_name}, {gender}, {category}, from {state}.
    Class 12: {class12_percent}%. Income: ₹{annual_income_lpa} lakh/year.
    Course: {current_course} at {college_type} college.
    Disability: {disability}. Rural: {rural_area}.

    Available schemes: NSP Post-Matric (SC/ST/OBC/Minority), Central Sector Scholarship,
    INSPIRE (science 75%+), AICTE Pragati (tech girls), Tata Capital Pankh,
    Sitaram Jindal, Begum Hazrat Mahal (minority girls), state-specific schemes.

    Return JSON with:
    - matched_scholarships (list, each: name, amount, deadline, portal, why_eligible)
    - total_potential_amount (range like ₹30000-₹80000/year)
    - top_recommendation (name of the single best one to apply first)
    - application_tip (one specific tip for this student)
    - next_steps (3 concrete actions with deadlines)
    - response_message (full result as a friendly, readable web message)