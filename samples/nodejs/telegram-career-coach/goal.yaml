id: career_coach
name: "Career Coach"
version: "1.0.0"
sector: education
tags: [career, coaching, job, resume, Telegram]

persona:
  name: "Coach"
  tone: "direct, motivating, honest — like a senior engineer giving real advice"
  empathy_level: medium
  language: auto
  greeting: >
    Hey! I am your AI career coach.
    Tell me where you are right now and where you want to go.
    I will give you a concrete, honest roadmap.

fields:
  - name: name
    type: text
    required: true
    question: "What's your name?"

  - name: current_role
    type: text
    required: true
    question: "What's your current role and how long have you been in it?"

  - name: experience_years
    type: number
    required: true
    min: 0
    max: 40
    question: "Total years of professional experience?"

  - name: top_skills
    type: text
    required: true
    question: "List your top 3 technical or functional skills."

  - name: target_role
    type: text
    required: true
    question: "What role do you want to be in 2 years from now?"

  - name: biggest_gap
    type: text
    required: true
    question: "What do you think is your biggest gap between where you are and that target role?"

  - name: learning_style
    type: text
    required: false
    allowed_values: [videos, reading, projects, bootcamp, mentorship, on-the-job]
    question: "How do you learn best? (videos / reading / projects / bootcamp / mentorship / on-the-job)"

  - name: hours_per_week
    type: integer
    required: true
    min: 1
    max: 40
    question: "How many hours per week can you invest in upskilling outside work?"

  - name: current_salary_lpa
    type: number
    required: false
    min: 0
    max: 500
    question: "Current CTC in LPA? (optional — helps calibrate target)"

  - name: timeline_months
    type: integer
    required: true
    min: 1
    max: 36
    question: "Target timeline in months to reach the new role?"

output:
  format: json
  template: >
    Career coach creating a personalised roadmap.
    Candidate: {name}. Current: {current_role}, {experience_years} years exp.
    Skills: {top_skills}. Target: {target_role} in {timeline_months} months.
    Gap: {biggest_gap}. Learning: {learning_style}. Time: {hours_per_week} hrs/week.
    Current CTC: {current_salary_lpa} LPA.

    Return JSON with:
    - readiness_score (0-100 — how ready they are right now)
    - skill_gaps (list of 3-5 specific skills to develop)
    - monthly_plan (list of 3-month blocks: each has focus, resources, milestones)
    - quick_wins (2-3 things they can do THIS WEEK)
    - resume_advice (2 specific improvements to their resume right now)
    - salary_projection (realistic CTC range in the target role)
    - honest_assessment (2-sentence straight talk — what is the hardest part of this transition)
    - telegram_summary (the full roadmap as clean Telegram-formatted text using *bold* and bullet points)
