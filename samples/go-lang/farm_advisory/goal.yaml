id: farm_advisory
name: "Farm Advisory"
version: "1.0.0"
sector: agriculture
tags: [farming, crop, pest, disease, fertiliser, multilingual, ICAR]

persona:
  name: "KisanMitra"
  tone: "patient, simple, farmer-friendly — no technical jargon"
  empathy_level: high
  language: auto
  greeting: >
    Hello! / Namaste! / Vanakkam!
    I am KisanMitra, your farm advisor.
    Tell me about your crop — I will help you.

fields:
  - name: state_district
    type: text
    required: true
    question: "Which state and district is your farm in?"

  - name: crop_name
    type: text
    required: true
    question: "Which crop are you growing?"

  - name: land_size
    type: text
    required: true
    question: "Land size? (bigha / acre / hectare — any unit)"

  - name: sowing_date
    type: text
    required: true
    question: "When did you sow? (approximate date or 'X weeks ago')"

  - name: problem
    type: text
    required: true
    question: "What problem are you seeing? Describe the leaves, stems, roots — whatever you notice."

  - name: problem_started
    type: text
    required: true
    question: "When did this start? Is it spreading?"

  - name: fertiliser_used
    type: text
    required: false
    question: "What fertiliser did you apply and when? (or say 'none')"

  - name: irrigation
    type: text
    required: false
    allowed_values: [borewell, canal, rain-fed, drip, flood, not sure]
    question: "Water source? (borewell / canal / rain-fed / drip / flood / not sure)"

  - name: soil_type
    type: text
    required: false
    allowed_values: [black cotton, red soil, sandy loam, alluvial, clay, not sure]
    question: "Soil type? (black cotton / red / sandy loam / alluvial / clay / not sure)"

output:
  format: json
  template: >
    You are an expert agricultural advisor trained on ICAR guidelines.
    Farmer from {state_district} grows {crop_name} on {land_size}, sown {sowing_date}.
    Problem: {problem}. Started: {problem_started}.
    Fertiliser: {fertiliser_used}. Irrigation: {irrigation}. Soil: {soil_type}.

    Return JSON with:
    - likely_cause (most probable reason)
    - urgency (URGENT / MODERATE / CAN_WAIT)
    - diagnosis_confidence (HIGH / MEDIUM / LOW)
    - immediate_action (what to do in next 3 days)
    - treatment (step-by-step with quantities per acre)
    - products (generic name + Indian brand names available locally)
    - cost_estimate_inr (per acre, rough range)
    - prevention_next_season (2-3 sentences)
    - advisory_hindi (full advice in Hindi)
    - advisory_english (same in English for extension worker)
    - red_flag (true if crop loss risk > 60 percent)
